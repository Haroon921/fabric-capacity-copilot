name: Feature request
description: Suggest an improvement to the accelerator.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What user or operational need would this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed experience
      description: Describe the desired behavior and expected outcome.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Product area
      options:
        - Overview
        - Explorer
        - Investigation
        - Actions
        - Telemetry integration
        - Documentation
    validations:
      required: true
